<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素回合制战斗 - YOUXI (网页版)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:#1c202c;color:#eef;font-family:'Courier New',Courier,monospace;overflow-x:hidden;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#1c202c}
.screen{width:100%;display:none;flex-direction:column;align-items:center;padding:12px}
.screen.active{display:flex}
.title{color:#ffdc78;font-size:34px;margin-top:56px;font-weight:bold;letter-spacing:4px;text-align:center}
.subtitle{color:#96a0be;font-size:18px;margin:8px 0 44px;letter-spacing:10px}
.menu-btn{width:240px;height:58px;margin:10px;background:#3c5a8c;color:#fff;font-size:22px;border:none;cursor:pointer;font-family:inherit;letter-spacing:6px}
.menu-btn:hover{background:#46679e}
.menu-btn:active{background:#2b4470}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;width:100%}
.card{background:#32384a;flex:1 1 150px;min-width:140px;max-width:210px;padding:10px 8px;cursor:pointer;text-align:center;border:2px solid #32384a}
.card:hover{border-color:#ffdc78}
.card:active{background:#4a5268}
.card canvas{image-rendering:pixelated;background:#0005;display:block;margin:0 auto;width:140px;height:140px}
.card-name{color:#fff;font-size:22px;margin-top:6px;font-weight:bold}
.card-sub{color:#96a0be;font-size:12px;margin-top:2px}
#screen-playing{width:100%;align-items:center}
#topbar{width:100%;max-width:615px;background:#2a2e3c;padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;position:relative}
#stat-hp{color:#ffe650;font-weight:bold;font-size:22px;line-height:1.4}
#info-line1{color:#e6ebf5;font-size:15px;line-height:1.4}
#info-line2{color:#96a0be;font-size:13px;width:100%;line-height:1.4}
#btn-menu{margin-left:auto;background:#4a5268;color:#fff;border:none;padding:6px 14px;font-family:inherit;font-size:14px;cursor:pointer}
#btn-menu:active{background:#3a4152}
/* 怪物血条区：玩家状态栏下方（与桌面版 DrawMonsterBars 布局一致：名称118px/血条116px/数值60px） */
#monster-bars{width:100%;max-width:615px;background:#0e121a;padding:4px 8px;display:none;flex-direction:column;border-bottom:1px solid #1a1420}
#monster-bars .mb-row{display:flex;align-items:center;height:18px;line-height:18px}
#monster-bars .mb-name{width:118px;color:#ebc8c8;white-space:nowrap;overflow:hidden;font-size:12px}
#monster-bars .mb-name.boss{color:#ffaa5a}
#monster-bars .mb-bar-bg{width:116px;height:9px;background:#1a0c0e;margin:0 8px 0 4px;position:relative}
#monster-bars .mb-bar-fill{position:absolute;left:0;top:0;height:100%;background:#dc4646}
#monster-bars .mb-bar-fill.boss{background:#ff823c}
#monster-bars .mb-hp{width:60px;color:#fff;font-size:12px}
#monster-bars .mb-more{color:#96a0be;font-size:11px;height:16px;line-height:16px}
#canvas-wrap{width:100%;max-width:615px;background:#141820;padding:8px}
#game{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#battle-status{width:100%;max-width:615px;background:#282e3c;padding:8px 12px;font-size:20px;line-height:1.8;display:none;color:#ebf0fa}
#battle-status .bs-title{color:#ffdc78;font-size:14px;text-align:center}
#battle-status .bs-player{color:#ffe650;font-weight:bold;font-size:22px}
#battle-menu{width:100%;max-width:615px;display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0}
#battle-menu.active{display:grid}
#battle-menu button{height:54px;font-size:22px;color:#fff;background:#463c50;border:none;font-family:inherit;cursor:pointer;letter-spacing:4px}
#battle-menu button:active{background:#5a4c66}
#battle-menu button.hl{background:#b45a1e}
#controls{width:100%;max-width:615px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 24px;gap:10px}
#dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
#dpad .right{grid-column:3;grid-row:2}
.dbtn{background:#3c5a8c;color:#fff;font-size:24px;border:none;cursor:pointer;font-family:inherit}
.dbtn:active{background:#2b4470}
#btn-q{width:96px;height:96px;border-radius:50%;background:#8c3c3c;color:#fff;font-size:20px;border:none;cursor:pointer;font-family:inherit;font-weight:bold}
#btn-q:active{background:#b04c4c}
#btn-b{width:96px;height:96px;border-radius:50%;background:#3c7a4c;color:#fff;font-size:20px;border:none;cursor:pointer;font-family:inherit;font-weight:bold}
#btn-b:active{background:#4c9a5c}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0c0c12;color:#ffe650;font-size:24px;padding:12px 26px;z-index:50;display:none;border:2px solid #ffe650;text-align:center;max-width:82%;letter-spacing:1px}
.modal{position:fixed;inset:0;background:rgba(10,10,18,.88);display:none;align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.panel{width:min(480px,90vw);background:#2a2e3e;border-top:4px solid #ffdc78;padding:28px 16px;text-align:center}
.modal-title{color:#ffdc78;font-size:24px;font-weight:bold;margin-bottom:10px}
.modal-sub{color:#ebf0fa;font-size:16px;margin-bottom:16px}
.panel button{width:150px;height:58px;margin:8px;font-size:20px;background:#3c5a8c;color:#fff;border:none;cursor:pointer;font-family:inherit}
.panel button:active{background:#2b4470}
.modal-note{color:#96a0be;font-size:13px;margin-top:12px}
/* 周目选角：历史已用角色灰卡不可选（与桌面版 usedCharacterIds 灰卡一致） */
.card.used{background:#262834;border-color:#262834;cursor:default}
.card.used:hover{border-color:#262834}
.card.used .card-name{color:#8c8e98}
/* 背包 / 白纸收藏页（与桌面版 DrawBagOverlay 布局语义一致） */
#bag-body{text-align:left;color:#e6ebf5;font-size:15px;line-height:1.6;margin:6px 0 10px;min-height:60px}
.bag-row{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #3a3f52}
.bag-row .bag-desc{flex:1;color:#c8d0e2}
.bag-row .bag-desc b{color:#ffdc78}
.bag-row .bag-desc .used-tag{color:#8c8e98}
.bag-row .bag-act{width:96px;margin-left:10px}
.bag-row .bag-act button{width:100%;height:44px;font-size:17px;background:#3c5a8c;color:#fff;border:none;cursor:pointer;font-family:inherit}
.bag-row .bag-act button:active{background:#2b4470}
.bag-row .bag-act button.off{background:#454b5c}
#bag-paper-list .bag-paper-item{color:#d8d8e0;padding:6px 4px;border-bottom:1px solid #33374a;font-size:15px;line-height:1.5}
#bag-paper-list .bag-paper-item b{color:#ffdc78}
#bag-uncollected{color:#96a0be;font-size:14px;padding:4px;margin-bottom:4px}
#bag-empty-note{color:#96a0be;font-size:14px;padding:10px 4px}
#bag-btns{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:6px}
</style>
</head>

<div id="app">

  <!-- 主菜单 -->
  <div id="screen-menu" class="screen active">
    <div class="title">像素回合制战斗</div>
    <div class="subtitle">YOUXI</div>
    <button class="menu-btn" id="btn-new">新游戏</button>
    <button class="menu-btn" id="btn-continue">继续游戏</button>
    <button class="menu-btn" id="btn-boss">Boss 预览</button>
    <button class="menu-btn" id="btn-boss2">Boss2 预览</button>
    <button class="menu-btn" id="btn-boss3">Boss3 预览</button>
    <button class="menu-btn" id="btn-exit">退出游戏</button>
  </div>

  <!-- 角色选择 -->
  <div id="screen-select" class="screen">
    <div class="title" style="margin-top:20px;font-size:26px" id="select-title">选择你的角色</div>
    <div class="cards">
      <div class="card" data-cls="0"><canvas width="200" height="200"></canvas><div class="card-name">战士</div><div class="card-sub">单击选择</div></div>
      <div class="card" data-cls="1"><canvas width="200" height="200"></canvas><div class="card-name">法师</div><div class="card-sub">单击选择</div></div>
      <div class="card" data-cls="2"><canvas width="200" height="200"></canvas><div class="card-name">弓箭手</div><div class="card-sub">单击选择</div></div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="screen-playing" class="screen">
    <div id="topbar">
      <div id="stat-hp"></div>
      <div id="info-line1"></div>
      <button id="btn-menu">菜单</button>
      <div id="info-line2"></div>
    </div>
    <div id="monster-bars"></div>
    <div id="canvas-wrap"><canvas id="game" width="615" height="615"></canvas></div>
    <div id="battle-status"></div>
    <div id="battle-menu">
      <button id="bm-attack">攻击</button>
      <button id="bm-move">移动</button>
      <button id="bm-skill">技能</button>
      <button id="bm-bag">背包</button>
    </div>
    <div id="controls">
      <div id="dpad">
        <button class="dbtn up" data-dx="0" data-dy="-1">▲</button>
        <button class="dbtn left" data-dx="-1" data-dy="0">◀</button>
        <button class="dbtn down" data-dx="0" data-dy="1">▼</button>
        <button class="dbtn right" data-dx="1" data-dy="0">▶</button>
      </div>
      <button id="btn-q">Q<br>技能</button>
      <button id="btn-b">B<br>背包</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- 击杀奖励弹窗 -->
  <div id="reward-modal" class="modal">
    <div class="panel">
      <div class="modal-title" id="reward-title">击杀奖励！</div>
      <div class="modal-sub">选择一项属性永久 +1：</div>
      <button id="rw-hp">HP +1</button>
      <button id="rw-atk">攻击 +1</button>
      <button id="rw-mp">MP +1</button>
      <div class="modal-note">点击后立即生效，并保存到存档</div>
    </div>
  </div>

  <!-- 背包 / 白纸收藏页（与桌面版 DrawBagOverlay 一致：主视图 + 白纸收藏页两个子视图） -->
  <div id="bag-modal" class="modal">
    <div class="panel">
      <div class="modal-title" id="bag-title">背包（E / Esc 关闭）</div>
      <div id="bag-body"></div>
      <div id="bag-btns"></div>
    </div>
  </div>

</div>

/* ============ 地图生成 ============ */
function mapGenerate(){
  var maxRetries=60, grid, start, end;
  for(var attempt=0;attempt<maxRetries;attempt++){
    grid=[];
    for(var y=0;y<SIZE;y++){ grid.push([]); for(var x=0;x<SIZE;x++) grid[y].push(0); }
    start=(rand(2)===0)?{x:0,y:rand(SIZE)}:{x:rand(SIZE),y:SIZE-1};
    end=(rand(2)===0)?{x:SIZE-1,y:rand(SIZE)}:{x:rand(SIZE),y:0};
    var placed=0, guard=0, obstacleCount=Math.floor(SIZE*SIZE*40/100);
    while(placed<obstacleCount && guard<obstacleCount*100){
      guard++;
      var x=rand(SIZE), y=rand(SIZE);
      if((x===start.x&&y===start.y)||(x===end.x&&y===end.y)||grid[y][x]===1) continue;
      grid[y][x]=1; placed++;
    }
    if(isFullyConnected(grid,start)){
      save.mapGrid=flattenGrid(grid);
      save.start=start; save.end=end;
      return;
    }
  }
  fixConnectivity(grid,start);
  save.mapGrid=flattenGrid(grid);
  save.start=start; save.end=end;
}
/* Boss 稀疏地图：障碍 5~15 且八方向不相邻（桌面版 generateSparse） */
function generateSparse(minCount,maxCount){
  var maxRetries=30, grid, start, end;
  for(var attempt=0;attempt<maxRetries;attempt++){
    grid=[];
    for(var y=0;y<SIZE;y++){ grid.push([]); for(var x=0;x<SIZE;x++) grid[y].push(0); }
    start=(rand(2)===0)?{x:0,y:rand(SIZE)}:{x:rand(SIZE),y:SIZE-1};
    end=(rand(2)===0)?{x:SIZE-1,y:rand(SIZE)}:{x:rand(SIZE),y:0};
    var target=minCount+rand(maxCount-minCount+1);
    var placed=0, guard=0;
    while(placed<target && guard<target*200){
      guard++;
      var x=rand(SIZE), y=rand(SIZE);
      if((x===start.x&&y===start.y)||(x===end.x&&y===end.y)||grid[y][x]===1) continue;
      var nearWall=false;
      for(var dy=-1;dy<=1;dy++){
        for(var dx=-1;dx<=1;dx++){
          if(dx===0&&dy===0) continue;
          var nx=x+dx, ny=y+dy;
          if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&grid[ny][nx]===1){ nearWall=true; }
        }
      }
      if(nearWall) continue;
      grid[y][x]=1; placed++;
    }
    if(isFullyConnected(grid,start)){
      save.mapGrid=flattenGrid(grid);
      save.start=start; save.end=end;
      return;
    }
  }
  fixConnectivity(grid,start);
  save.mapGrid=flattenGrid(grid);
  save.start=start; save.end=end;
}
/* 全连通校验：起点 BFS 可达空地数 == 全图空地数（桌面版 isFullyConnected） */
function isFullyConnected(grid,start){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var visited=[]; for(var y=0;y<SIZE;y++){ visited.push([]); for(var x=0;x<SIZE;x++) visited[y].push(false); }
  var q=[start]; visited[start.y][start.x]=true;
  var reachable=0;
  while(q.length){
    var cur=q.shift(); reachable++;
    for(var i=0;i<4;i++){
      var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(grid[ny][nx]!==0||visited[ny][nx]) continue;
      visited[ny][nx]=true; q.push({x:nx,y:ny});
    }
  }
  var open=0;
  for(var yy=0;yy<SIZE;yy++) for(var xx=0;xx<SIZE;xx++) if(grid[yy][xx]===0) open++;
  return reachable===open;
}
function connectedComponents(grid){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var visited=[]; for(var y=0;y<SIZE;y++){ visited.push([]); for(var x=0;x<SIZE;x++) visited[y].push(false); }
  var components=0;
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(grid[y][x]!==0||visited[y][x]) continue;
      components++;
      var q=[{x:x,y:y}]; visited[y][x]=true;
      while(q.length){
        var cur=q.shift();
        for(var i=0;i<4;i++){
          var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
          if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
          if(grid[ny][nx]!==0||visited[ny][nx]) continue;
          visited[ny][nx]=true; q.push({x:nx,y:ny});
        }
      }
    }
  }
  return components;
}
/* 确定性修正：逐个试探移除障碍直到非障碍格单一连通（桌面版 fixConnectivity） */
function fixConnectivity(grid,start){
  var components=connectedComponents(grid);
  while(components>1){
    var removedAny=false;
    for(var y=0;y<SIZE&&!removedAny;y++){
      for(var x=0;x<SIZE;x++){
        if(grid[y][x]!==1) continue;
        grid[y][x]=0;
        var c=connectedComponents(grid);
        if(c<components){ components=c; removedAny=true; break; }
        grid[y][x]=1;
      }
    }
    if(!removedAny){
      for(var yy=0;yy<SIZE;yy++) for(var xx=0;xx<SIZE;xx++) if(grid[yy][xx]===1) grid[yy][xx]=0;
      break;
    }
  }
}
function flattenGrid(grid){ var a=[]; for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++) a.push(grid[y][x]); return a; }
function unflattenGrid(a){ var g=[]; for(var y=0;y<SIZE;y++){ g.push([]); for(var x=0;x<SIZE;x++) g[y].push(a[y*SIZE+x]); } return g; }
function gridAt(gx,gy){ return save.mapGrid[gy*SIZE+gx]; }
function isReachable(grid,from,to){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var visited=[]; for(var y=0;y<SIZE;y++){ visited.push([]); for(var x=0;x<SIZE;x++) visited[y].push(false); }
  var q=[from]; visited[from.y][from.x]=true;
  while(q.length){
    var cur=q.shift();
    if(cur.x===to.x&&cur.y===to.y) return true;
    for(var i=0;i<4;i++){
      var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(grid[ny][nx]!==0||visited[ny][nx]) continue;
      visited[ny][nx]=true; q.push({x:nx,y:ny});
    }
  }
  return false;
}

/* ============ 攻击范围 ============ */
function archerInRange(ax,ay,adir,bx,by){
  var dx=bx-ax, dy=by-ay, front=false, back=false, side=false;
  switch(adir){
    case DIR.UP:   front=(dx===0&&dy>=-4&&dy<=-1); back=(dx===0&&dy===1); side=(dy===0&&dx>=-2&&dx<=2&&dx!==0); break;
    case DIR.DOWN: front=(dx===0&&dy>=1&&dy<=4);   back=(dx===0&&dy===-1); side=(dy===0&&dx>=-2&&dx<=2&&dx!==0); break;
    case DIR.RIGHT:front=(dy===0&&dx>=1&&dx<=4);   back=(dy===0&&dx===-1); side=(dx===0&&dy>=-2&&dy<=2&&dy!==0); break;
    case DIR.LEFT: front=(dy===0&&dx>=-4&&dx<=-1); back=(dy===0&&dx===1); side=(dx===0&&dy>=-2&&dy<=2&&dy!==0); break;
  }
  return front||back||side;
}
function inAttackRange(cls,ax,ay,adir,bx,by){
  var dx=Math.abs(bx-ax), dy=Math.abs(by-ay);
  if(cls===0) return dx<=1&&dy<=1&&!(dx===0&&dy===0);
  if(cls===3) return dx<=1&&dy<=1;
  if(cls===1) return (dx===0&&dy<=2)||(dy===0&&dx<=2);
  return archerInRange(ax,ay,adir,bx,by);
}
function playerInAttackRange(m){
  return inAttackRange(save.characterId,save.playerX,save.playerY,save.playerDir,m.x,m.y);
}
function anyMonsterInPlayerRange(){
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(m.alive&&playerInAttackRange(m)) return true; }
  return false;
}
/* ===== Boss2 三弓神射手：三弓范围（与桌面版 main.cpp 一致） ===== */
function boss2RangeCount(bowState){
  if(bowState===0) return 10;  /* 黄弓 3x3 + 外圈随机 1 格 */
  if(bowState===1) return 7;   /* 蓝弓十字 */
  return 6;                    /* 红弓纵线 */
}
function boss2Rotate(rx,ry,dir,ox,oy){
  if(dir===DIR.RIGHT) return {x:ox-ry,y:oy+rx};
  if(dir===DIR.DOWN) return {x:ox-rx,y:oy-ry};
  if(dir===DIR.LEFT) return {x:ox+ry,y:oy-rx};
  return {x:ox+rx,y:oy+ry};
}
function boss2RangeAt(bowState,ox,oy,dir,idx){
  var rx=0, ry=0;
  if(bowState===0){
    if(idx<0||idx>8) return null;
    rx=(idx%3)-1; ry=Math.floor(idx/3)-1;
  }else if(bowState===1){
    var bx7=[[0,-1],[0,-2],[0,-3],[0,1],[0,2],[-1,0],[1,0]];
    if(idx<0||idx>=7) return null;
    rx=bx7[idx][0]; ry=bx7[idx][1];
  }else{
    var rx6=[[0,-1],[0,-2],[0,-3],[0,-4],[0,1],[0,2]];
    if(idx<0||idx>=6) return null;
    rx=rx6[idx][0]; ry=rx6[idx][1];
  }
  return boss2Rotate(rx,ry,dir,ox,oy);
}
function boss2RangeExtraAt(extra,ox,oy,dir){
  var ex16=[[-2,-2],[-2,-1],[-2,0],[-2,1],[-2,2],[-1,2],[0,2],[1,2],[2,2],[2,1],[2,0],[2,-1],[2,-2],[1,-2],[0,-2],[-1,-2]];
  if(extra<0||extra>=16) return null;
  return boss2Rotate(ex16[extra][0],ex16[extra][1],dir,ox,oy);
}
function boss2CellForIdx(m,idx){
  if(m.bowState===0&&idx===9) return boss2RangeExtraAt(m.bowExtra,m.x,m.y,m.dir);
  return boss2RangeAt(m.bowState,m.x,m.y,m.dir,idx);
}
function boss2InFullRange(m,px,py){
  for(var idx=0;idx<boss2RangeCount(m.bowState);idx++){
    var c=boss2CellForIdx(m,idx);
    if(c&&c.x===px&&c.y===py) return true;
  }
  return false;
}
function boss2MissedAt(m,px,py){
  var c;
  if(m.missA>=0){ c=boss2CellForIdx(m,m.missA); if(c&&c.x===px&&c.y===py) return true; }
  if(m.missB>=0){ c=boss2CellForIdx(m,m.missB); if(c&&c.x===px&&c.y===py) return true; }
  return false;
}
function rollBoss2Moves(m){
  var count=boss2RangeCount(m.bowState);
  if(count<=1){ m.missA=-1; m.missB=-1; return; }
  m.missA=rand(count);
  m.missB=rand(count-1);
  if(m.missB>=m.missA) m.missB++;
}
function rollBoss2Extra(m){ m.bowExtra=rand(16); }
function boss2HitsPlayer(m,px,py){
  return boss2InFullRange(m,px,py)&&!boss2MissedAt(m,px,py);
}
/* ===== Boss3 大元素使者：随机元素范围 + 身边一格 nearDir 顺时针旋转（与桌面版 main.cpp 一致） ===== */
function rollBoss3Elements(m){
  m.elementCells=[];
  var empty=[];
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;
      if(x===m.x&&y===m.y) continue;
      empty.push({x:x,y:y});
    }
  }
  if(empty.length===0) return;
  var count=20+rand(16);
  if(count>empty.length) count=empty.length;
  shuffle(empty);
  for(var i=0;i<count;i++) m.elementCells.push({x:empty[i].x,y:empty[i].y});
}
function boss3NearCellAt(m,px,py){
  var ndx=[0,1,1,1,0,-1,-1,-1];
  var ndy=[-1,-1,0,1,1,1,0,-1];
  var gx=m.x+ndx[m.nearDir], gy=m.y+ndy[m.nearDir];
  if(gx<0||gx>=SIZE||gy<0||gy>=SIZE) return false;
  if(gridAt(gx,gy)!==0) return false;
  return px===gx&&py===gy;
}
function boss3HitsAt(m,px,py){
  for(var i=0;i<m.elementCells.length;i++){
    if(m.elementCells[i].x===px&&m.elementCells[i].y===py) return true;
  }
  return boss3NearCellAt(m,px,py);
}
/* 受击传送：Boss3 被玩家攻击命中后，传送到玩家攻击范围外的非墙空地并休息一轮（与桌面版 TeleportBoss3 一致） */
function teleportBoss3(m){
  var cand=[];
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;
      if(x===m.x&&y===m.y) continue;
      if(x===save.playerX&&y===save.playerY) continue;
      if(inAttackRange(save.characterId,save.playerX,save.playerY,save.playerDir,x,y)) continue;
      cand.push({x:x,y:y});
    }
  }
  if(cand.length===0) return;
  var p=cand[rand(cand.length)];
  m.x=p.x; m.y=p.y;
  m.nearDir=(m.nearDir+1)%8;
}
/* Boss 3x3 每回合随机缺一格（与桌面版 BossMissedAt 一致） */
function bossMissedAt(m,px,py){
  var gx=m.x+(m.missIndex%3)-1;
  var gy=m.y+Math.floor(m.missIndex/3)-1;
  return gx===px&&gy===py;
}
/* 无墙路径：怪物不能隔墙攻击（与桌面版 HasClearPath 一致） */
function hasClearPath(ax,ay,bx,by){
  if(ax===bx&&ay===by) return true;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var visited=[]; for(var y=0;y<SIZE;y++){ visited.push([]); for(var x=0;x<SIZE;x++) visited[y].push(false); }
  var q=[{x:ax,y:ay}]; visited[ay][ax]=true;
  while(q.length){
    var cur=q.shift();
    for(var i=0;i<4;i++){
      var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(visited[ny][nx]) continue;
      if(nx===bx&&ny===by) return true;
      if(gridAt(nx,ny)!==0) continue;
      visited[ny][nx]=true; q.push({x:nx,y:ny});
    }
  }
  return false;
}
/* 统一怪物范围命中判定（与桌面版 MonsterRangeHits 一致，提示与判定共用失去格） */
function monsterRangeHits(m,px,py){
  if(!m.alive) return false;
  if(m.isBoss3&&m.type===BOSS3_TYPE)
    return boss3HitsAt(m,px,py)&&hasClearPath(m.x,m.y,px,py);
  if(m.isBoss2&&m.type===BOSS2_TYPE)
    return boss2HitsPlayer(m,px,py)&&hasClearPath(m.x,m.y,px,py);
  if(m.isBoss&&m.type===BOSS_TYPE)
    return inAttackRange(m.type,m.x,m.y,m.dir,px,py)&&!bossMissedAt(m,px,py)&&hasClearPath(m.x,m.y,px,py);
  return inAttackRange(m.type,m.x,m.y,m.dir,px,py)&&hasClearPath(m.x,m.y,px,py);
}
function anyMonsterCanAttackPlayer(){
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(monsterRangeHits(m,save.playerX,save.playerY)) return true; }
  return false;
}
function newlyEnteredMonsterRange(oldX,oldY){
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(!m.alive) continue;
    var before=monsterRangeHits(m,oldX,oldY);
    var after=monsterRangeHits(m,save.playerX,save.playerY);
    if(!before&&after) return true; }
  return false;
}

/* ============ 怪物生成与成长 ============ */
/* 成长倍数：1..level 中 5/8 的倍数关数（与桌面版 MonsterGrowthTimes 一致） */
function monsterGrowthTimes(level){
  var t=0;
  for(var i=1;i<=level;i++){ if(i%5===0||i%8===0) t++; }
  return t;
}
function applyMonsterGrowth(m,clearCount){
  var times=monsterGrowthTimes(clearCount);
  for(var i=0;i<times;i++){
    if(rand(2)===0) m.hp++; else m.atk++;
  }
}
function generateMonsters(){
  save.monsters=[];
  var count=5+save.clearCount*2; if(count>35) count=35;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var visited=[]; for(var y=0;y<SIZE;y++){ visited.push([]); for(var x=0;x<SIZE;x++) visited[y].push(false); }
  var reachable=[];
  var q=[{x:save.start.x,y:save.start.y}]; visited[save.start.y][save.start.x]=true;
  while(q.length){
    var cur=q.shift(); reachable.push(cur);
    for(var i=0;i<4;i++){
      var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(gridAt(nx,ny)!==0||visited[ny][nx]) continue;
      visited[ny][nx]=true; q.push({x:nx,y:ny});
    }
  }
  var guard=0;
  while(save.monsters.length<count && guard<count*200+500){
    guard++;
    if(reachable.length===0) break;
    var p=reachable[rand(reachable.length)];
    if(p.x===save.start.x&&p.y===save.start.y) continue;
    if(p.x===save.end.x&&p.y===save.end.y) continue;
    if(p.x===save.playerX&&p.y===save.playerY) continue;
    var occ=false;
    for(var j=0;j<save.monsters.length;j++) if(save.monsters[j].x===p.x&&save.monsters[j].y===p.y){occ=true;break;}
    if(occ) continue;
    var m={type:rand(3),x:p.x,y:p.y,hp:0,atk:0,dir:DIR.UP,alive:true,isBoss:false,isBoss2:false};
    var cs=classStats(m.type);
    m.hp=cs.hp;
    m.atk=Math.ceil(cs.atk/2);
    applyMonsterGrowth(m,save.clearCount);
    /* Boss 通关加成：正式通过的 Boss 关卡数累计 0~3，后续普通怪全属性 +bossCleared（与桌面版一致） */
    m.hp+=save.bossCleared||0;
    m.atk+=save.bossCleared||0;
    m.maxhp=m.hp;   /* 血条满血基准 */
    save.monsters.push(m);
  }
  /* 微粒与怪物同步生成（与桌面版 GenerateMonsters 末尾调用 GeneratePickups 一致） */
  generatePickupsForLevel();
}
/* 按当前关卡生成地图微粒（拾取物）：蓝菱恢复 1 MP、红心恢复 2 HP。
   数量 = max(1, ceil(本关怪物总数/3))；蓝/红约各半随机分配；
   排除障碍格/四面围墙格/起点格/终点格/玩家当前位置/怪物占位格，微粒彼此不重叠（与桌面版 GeneratePickups 一致） */
function generatePickupsForLevel(){
  save.pickups=[];
  var monsterCount=save.monsters.length;
  var count=Math.floor((monsterCount+2)/3);   // ceil(monsterCount/3)
  if(count<1) count=1;                        // 每关至少 1 个
  var empty=[];
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;
      if(isSurroundedByWalls(x,y)) continue;
      if(x===save.start.x&&y===save.start.y) continue;
      if(x===save.end.x&&y===save.end.y) continue;
      if(x===save.playerX&&y===save.playerY) continue;
      var hasMonster=false;
      for(var i=0;i<save.monsters.length;i++) if(save.monsters[i].alive&&save.monsters[i].x===x&&save.monsters[i].y===y){hasMonster=true;break;}
      if(hasMonster) continue;
      empty.push({x:x,y:y});
    }
  }
  var blue=Math.floor(count/2)+rand(2);       // 蓝菱数量约一半，剩余为红心
  if(blue>count) blue=count;
  var used=[]; for(var j=0;j<empty.length;j++) used.push(false);
  var guard=0;
  while(save.pickups.length<count && guard<count*200+500){
    guard++;
    if(empty.length===0) break;               // 极端情况：无可用空位
    var idx=rand(empty.length);
    if(used[idx]) continue;                   // 已被其他微粒占用 → 重试
    var p=empty[idx];
    save.pickups.push({x:p.x,y:p.y,kind:(save.pickups.length<blue)?0:1});  // 先放蓝菱，再放红心
    used[idx]=true;
  }
}
// 探索阶段同步移动：玩家每移动一次，全场存活怪物统一向玩家靠近移动一格
// （不撞边界/障碍/其他怪物/玩家）。约 70% 概率沿 BFS 最短路方向逼近，其余随机扰动。
function moveMonstersTowardPlayer(){
  // BFS 以玩家为源泛洪：每格到玩家的最短距离（仅空地可达）
  var SIZE2=SIZE, INF=1<<29;
  var dist=[]; for(var yy=0;yy<SIZE2;yy++){ dist.push([]); for(var xx=0;xx<SIZE2;xx++) dist[yy].push(INF); }
  var q=[], qh=0;
  dist[save.playerY][save.playerX]=0; q.push([save.playerX,save.playerY]);
  while(qh<q.length){
    var cur=q[qh++], cx=cur[0], cy=cur[1];
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var di=0;di<4;di++){
      var nx=cx+dirs[di][0], ny=cy+dirs[di][1];
      if(nx<0||nx>=SIZE2||ny<0||ny>=SIZE2) continue;
      if(gridAt(nx,ny)===1) continue;
      if(dist[ny][nx]!==INF) continue;
      dist[ny][nx]=dist[cy][cx]+1; q.push([nx,ny]);
    }
  }
  var dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i]; if(!m.alive) continue;
    var allCands=[], bestCands=[];
    var bestDist=INF;
    for(var d=0;d<4;d++){
      var nx=m.x+dirs4[d][0], ny=m.y+dirs4[d][1];
      if(nx<0||nx>=SIZE2||ny<0||ny>=SIZE2) continue;          // 边界
      if(gridAt(nx,ny)===1) continue;                          // 障碍
      if(nx===save.playerX&&ny===save.playerY) continue;       // 玩家格
      var occ=false;
      for(var j=0;j<save.monsters.length;j++){
        var o=save.monsters[j];
        if(!o.alive||o===m) continue;
        if(o.x===nx&&o.y===ny){ occ=true; break; }             // 其他怪物
      }
      if(occ) continue;
      allCands.push([dirs4[d][0],dirs4[d][1]]);
      if(dist[ny][nx]<bestDist){ bestDist=dist[ny][nx]; bestCands.length=0; }
      if(dist[ny][nx]===bestDist&&bestDist<INF) bestCands.push([dirs4[d][0],dirs4[d][1]]);
    }
    if(allCands.length===0) continue;                          // 被包围 → 原地不动
    var chosen;
    if(bestCands.length>0&&Math.random()<0.7)
      chosen=bestCands[Math.floor(Math.random()*bestCands.length)];
    else
      chosen=allCands[Math.floor(Math.random()*allCands.length)];
    m.x+=chosen[0]; m.y+=chosen[1];
    m.dir=dirFromDelta(chosen[0],chosen[1]);                   // 朝向跟随移动方向
    if(m.isBoss3&&m.type===BOSS3_TYPE) m.nearDir=(m.nearDir+1)%8;  // 身边一格随移动顺时针旋转（与桌面版一致）
  }
}
function runMonsterTurn(){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i]; if(!m.alive) continue;
    /* Boss3 受击传送后休息一轮（与桌面版 teleportSkip 一致） */
    if(m.isBoss3&&m.type===BOSS3_TYPE&&m.teleportSkip){ m.teleportSkip=false; continue; }
    var inRange=inAttackRange(m.type,m.x,m.y,m.dir,save.playerX,save.playerY);
    var canAttack=false, bossMiss=false;
    /* Boss2 三弓神射手：当前弓完整范围-失去2格；命中/落空判定后按黄→蓝→红→黄切换并重掷下一轮状态（与桌面版一致） */
    if(m.isBoss2&&m.type===BOSS2_TYPE){
      if(boss2InFullRange(m,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY)){
        bossMiss=boss2MissedAt(m,save.playerX,save.playerY);
        canAttack=!bossMiss;
        m.bowState=(m.bowState+1)%3;
        rollBoss2Extra(m);
        rollBoss2Moves(m);
      }
    } else if(m.isBoss&&m.type===BOSS_TYPE){
      /* 第一 Boss：每回合开始重掷 3x3 缺一格，提示与判定共用 missIndex（与桌面版一致） */
      m.missIndex=rand(9);
      if(inRange&&hasClearPath(m.x,m.y,save.playerX,save.playerY)){
        bossMiss=bossMissedAt(m,save.playerX,save.playerY);
        canAttack=!bossMiss;
      }
    } else if(m.isBoss3&&m.type===BOSS3_TYPE){
      /* Boss3 大元素使者：命中判定=元素范围或身边一格且无墙；20% 施法失败不扣血并重掷元素范围（与桌面版一致） */
      if(boss3HitsAt(m,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY)){
        if(rand(100)<20){
          rollBoss3Elements(m);
          toast('元素使者施法失败');
          continue;
        }
        canAttack=true;
        rollBoss3Elements(m);
      }
    } else if(inRange&&hasClearPath(m.x,m.y,save.playerX,save.playerY)){
      canAttack=true;
    }
    if(bossMiss){
      toast((m.isBoss2&&m.type===BOSS2_TYPE)?'Boss2 箭矢落空':'Boss 攻击落空');
      continue;
    }
    if(canAttack){
      /* 怪物攻击命中特效：与桌面版一致——战士类怪（普通 Warrior、Boss1 盔甲战士）→ 月牙，
         弓箭手类怪（普通 Archer、Boss2 三弓神射手）→ 白色箭头（从怪物指向玩家），
         法师类怪（普通 Mage、Boss3 大元素使者）→ 白色光球；约 400ms 自动清除，Miss/落空不触发 */
      var ek=EFFECT_SLASH;
      if(m.type===2||(m.isBoss2&&m.type===BOSS2_TYPE)) ek=EFFECT_ARROW;
      else if(m.type===1||(m.isBoss3&&m.type===BOSS3_TYPE)) ek=EFFECT_ORB;
      addEffect(ek,m.x,m.y,save.playerX,save.playerY);
      var dmg=m.atk;
      if(save.tempHP>0){
        var absorbed=(dmg<save.tempHP)?dmg:save.tempHP;
        save.tempHP-=absorbed; dmg-=absorbed;
      }
      save.playerHp-=dmg;
      markPlayerHit();
      if(save.playerHp<=0) return true;
      continue;
    }
    moveOneMonster(m,dirs);
  }
  return false;
}
/* Boss 3x3 随机缺格：回合行动前重掷（探索阶段提示/判定与战斗共用 missIndex，与桌面版一致） */
function rollBossMiss(m){ m.missIndex=rand(9); }
/* 单个怪物向玩家逼近一步（Boss/Boss2/普通怪共用，与桌面版移动规则一致） */
function moveOneMonster(m,dirs){
  var cands=[], n=0;
  var curDist=Math.abs(m.x-save.playerX)+Math.abs(m.y-save.playerY);
  for(var d=0;d<4;d++){
    var nx=m.x+dirs[d][0], ny=m.y+dirs[d][1];
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
    if(gridAt(nx,ny)===1) continue;
    if(nx===save.playerX&&ny===save.playerY) continue;
    var occ=false;
    for(var j=0;j<save.monsters.length;j++){
      var o=save.monsters[j];
      if(!o.alive||o===m) continue;
      if(o.x===nx&&o.y===ny){occ=true;break;}
    }
    if(occ) continue;
    var nd=Math.abs(nx-save.playerX)+Math.abs(ny-save.playerY);
    if(nd<curDist) cands[n++]={dx:dirs[d][0],dy:dirs[d][1]};
  }
  if(n>0){
    var c=cands[rand(n)];
    m.x+=c.dx; m.y+=c.dy;
    m.dir=dirFromDelta(c.dx,c.dy);
    if(m.isBoss3&&m.type===BOSS3_TYPE) m.nearDir=(m.nearDir+1)%8;  // 身边一格随移动顺时针旋转（与桌面版一致）
  }
}

/* ============ Boss 房间 / 预览（与桌面版 SpawnBossRoom/StartBossPreview/StartFormalBossRoom 一致） ============ */
function spawnBossRoom(boss2,boss3){
  bossRoomActive=true; bossExitOpen=false; bossMoveCounter=0;

  generateSparse(5,15);
  save.playerX=save.start.x; save.playerY=save.start.y;

  var bossBonus=save.bossCleared||0;
  var boss;
  if(boss3){

    boss={type:BOSS3_TYPE,x:0,y:0,hp:25+bossBonus,maxhp:25+bossBonus,atk:10+bossBonus,dir:DIR.UP,alive:true,isBoss:false,isBoss2:false,isBoss3:true,teleportSkip:false,nearDir:0,elementCells:[]};
    rollBoss3Elements(boss);
  }else if(boss2){
    boss={type:BOSS2_TYPE,x:0,y:0,hp:25+bossBonus,maxhp:25+bossBonus,atk:10+bossBonus,dir:DIR.UP,alive:true,isBoss:false,isBoss2:true};
    boss.bowState=0;            /* 初始黄色弓 */
    rollBoss2Extra(boss);
    rollBoss2Moves(boss);
  }else{
    boss={type:BOSS_TYPE,x:0,y:0,hp:25+bossBonus,maxhp:25+bossBonus,atk:7+bossBonus,dir:DIR.UP,alive:true,isBoss:true,isBoss2:false};
    boss.missIndex=rand(9);     /* 初始随机缺格 */
  }
  var empty=[];
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;
      if(isSurroundedByWalls(x,y)) continue;
      if(Math.abs(x-save.start.x)<=2&&Math.abs(y-save.start.y)<=2) continue;
      if(x===save.start.x&&y===save.start.y) continue;
      if(x===save.end.x&&y===save.end.y) continue;
      if(x===save.playerX&&y===save.playerY) continue;
      empty.push({x:x,y:y});
    }
  }
  if(empty.length>0){ var p=empty[rand(empty.length)]; boss.x=p.x; boss.y=p.y; }
  else{ boss.x=save.playerX; boss.y=save.playerY; }
  save.monsters.push(boss);
}
function startBossPreview(boss2,boss3){

function startFormalBossRoom(boss2,boss3){

function isSurroundedByWalls(gx,gy){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){
    var nx=gx+dirs[i][0], ny=gy+dirs[i][1];
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
    if(gridAt(nx,ny)===0) return false;
  }
  return true;
}
/* 全灭结算：Boss 房击杀 Boss → 开绿出口停产微粒；普通关 → 战斗胜利（与桌面版 OnAllMonstersDead 一致） */

/* Boss 房每移动 5 次随机生成 1 个微粒（蓝菱 +1MP / 红心 +2HP） */
function spawnSinglePickupRandom(){
  var empty=[];
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;

function tryPickupAt(x,y){
  for(var i=0;i<save.pickups.length;i++){
    var p=save.pickups[i];
    if(p.x===x&&p.y===y){
      var cs=playerStats();
      if(p.kind===5){
        /* 白纸（kind=5）：拾取入背包收藏，仅首次拾取记录，移出地面标记（与桌面版 TryPickupAt 一致） */
        var dup=false;
        for(var wi=0;wi<save.whitePapersCollected.length;wi++){
          if(save.whitePapersCollected[wi]===p.index){ dup=true; break; }
        }
        if(!dup){
          save.whitePapersCollected.push(p.index);
          toast('拾取白纸 '+p.index+'：已收入白纸收藏');
        }else{
          toast('白纸 '+p.index+' 已收集过');
        }
        save.groundPapers=removeGroundPaper(save.groundPapers,p.index);
        save.pickups.splice(i,1);
        saveGame();
        return true;
      }
      if(p.kind===1){
        /* 红心：收入背包（使用：HP+2），上限 3（与桌面版一致） */
        save.bagHearts=Math.min(3,(save.bagHearts||0)+1);
        toast('获得红色微粒：已收入背包（使用：HP+2）');
      }else{
        /* 蓝菱：收入背包（使用：MP+1），上限 10（与桌面版一致） */
        save.bagGems=Math.min(10,(save.bagGems||0)+1);
        toast('获得蓝色微粒：已收入背包（使用：MP+1）');
      }
      save.pickups.splice(i,1);
      saveGame();
      return true;
    }
  }
  return false;
}
function removeGroundPaper(list,index){
  var out=[];
  for(var i=0;i<list.length;i++){ if(list[i].index!==index) out.push(list[i]); }
  return out;
}
/* 生成 1 张白纸（kind=5, index=paperIndex 1~9）：周边 3x3 可行空地优先（排除障碍/玩家格/怪物占位/已有拾取物），
   无空位则全图随机空地兜底（排除四面围墙/起点/终点/怪物/拾取物）。每张每时机恰好 1 次，跨周目不重复
   （与桌面版 SpawnWhitePaper 一致） */
function spawnWhitePaper(paperIndex){
  if(!save) return;
  save.whitePaperGen=save.whitePaperGen||[0,0,0,0,0,0,0,0,0];
  save.groundPapers=save.groundPapers||[];
  if(save.whitePaperGen[paperIndex-1]) return;   /* 每张白纸每个时机恰好生成 1 次，跨周目不重复 */
  var freeCell=function(x,y){
    if(x<0||x>=SIZE||y<0||y>=SIZE) return false;
    if(gridAt(x,y)!==0) return false;
    if(x===save.playerX&&y===save.playerY) return false;
    for(var mi=0;mi<save.monsters.length;mi++) if(save.monsters[mi].alive&&save.monsters[mi].x===x&&save.monsters[mi].y===y) return false;
    for(var pi=0;pi<save.pickups.length;pi++) if(save.pickups[pi].x===x&&save.pickups[pi].y===y) return false;
    return true;
  };
  var nx=-1, ny=-1, near=[];
  for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
    if(dx===0&&dy===0) continue;
    var cx=save.playerX+dx, cy=save.playerY+dy;
    if(freeCell(cx,cy)) near.push({x:cx,y:cy});
  }
  if(near.length>0){ var np=near[rand(near.length)]; nx=np.x; ny=np.y; }
  else{
    var empty=[];
    for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++){
      if(gridAt(x,y)!==0) continue;
      if(isSurroundedByWalls(x,y)) continue;
      if(x===save.start.x&&y===save.start.y) continue;
      if(x===save.end.x&&y===save.end.y) continue;
      if(freeCell(x,y)) empty.push({x:x,y:y});
    }
    if(empty.length>0){ var gp=empty[rand(empty.length)]; nx=gp.x; ny=gp.y; }
  }
  if(nx<0){ toast('白纸 '+paperIndex+' 无处生成'); return; }
  save.whitePaperGen[paperIndex-1]=1;
  save.groundPapers.push({index:paperIndex,x:nx,y:ny});
  save.pickups.push({x:nx,y:ny,kind:5,index:paperIndex});
  toast('白纸 '+paperIndex+' 出现在附近！');
  if(!bossPreview) saveGame();
}
/* 周目选角确认：未拾取白纸在新地图重新落位（周边一格优先，全图兜底；与桌面版选角分支一致） */
function relayoutGroundPapers(){
  if(!save.groundPapers||save.groundPapers.length===0) return;
  var newList=[];
  var freeCell2=function(x,y){
    if(x<0||x>=SIZE||y<0||y>=SIZE) return false;
    if(gridAt(x,y)!==0) return false;
    if(x===save.playerX&&y===save.playerY) return false;
    for(var mi=0;mi<save.monsters.length;mi++) if(save.monsters[mi].alive&&save.monsters[mi].x===x&&save.monsters[mi].y===y) return false;
    for(var pi=0;pi<save.pickups.length;pi++) if(save.pickups[pi].x===x&&save.pickups[pi].y===y) return false;
    return true;
  };
  for(var gi=0;gi<save.groundPapers.length;gi++){
    var gp=save.groundPapers[gi];
    var near=[]; var done=false;
    for(var dy=-1;dy<=1&&!done;dy++) for(var dx=-1;dx<=1&&!done;dx++){
      if(dx===0&&dy===0) continue;
      var cx=save.playerX+dx, cy=save.playerY+dy;
      if(freeCell2(cx,cy)){ near.push({x:cx,y:cy}); }
    }
    if(near.length>0){ var np=near[rand(near.length)]; gp.x=np.x; gp.y=np.y; done=true; }
    if(!done){
      var empty=[];
      for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++){
        if(gridAt(x,y)!==0) continue;
        if(isSurroundedByWalls(x,y)) continue;
        if(x===save.start.x&&y===save.start.y) continue;
        if(x===save.end.x&&y===save.end.y) continue;
        if(freeCell2(x,y)) empty.push({x:x,y:y});
      }
      if(empty.length>0){ var gp2=empty[rand(empty.length)]; gp.x=gp2.x; gp.y=gp2.y; }
    }
    newList.push({index:gp.index,x:gp.x,y:gp.y});
    if(gp.x>=0&&gp.y>=0) save.pickups.push({x:gp.x,y:gp.y,kind:5,index:gp.index});
  }
  save.groundPapers=newList;
}

/* ============ 通关 / 死亡 ============ */
function completeLevel(){
  /* 走到 Boss 房间出口（非预览）：Boss 通关加成 +1，上限 3（与桌面版一致；预览不计数） */
  if(bossExitOpen&&!bossPreview&&(save.bossCleared<3)) save.bossCleared++;
  /* 最终关：走到出口 → 通关回主菜单（与桌面版 FinishFinalLevel 一致） */
  if(finalLevel){ finishFinalLevel(); return; }
  /* 处于 Boss3 房间（clearCount==25）且击杀后走到出口 → 进入最终关卡（与桌面版一致） */
  if(save.clearCount===25&&bossExitOpen){ startFinalLevel(); return; }
  toast('恭喜通关！');
  save.clearCount++;
  // 战士：按本关击杀数 levelKills 结算 tempHP 加成（桌面版：每 2 杀 +1，上限 99）
  if(save.characterId===0&&save.levelKills>0){
    var gain=Math.floor(save.levelKills/2);
    save.tempHP+=gain; if(save.tempHP>99) save.tempHP=99;
  }
  // 通关恢复：HP/MP 各恢复当前剩余量的一半（向上取整），不超过职业上限；tempHP 不参与
  var pcs=playerStats();
  var hpGain=Math.ceil(save.playerHp/2);
  save.playerHp+=hpGain; if(save.playerHp>pcs.hp) save.playerHp=pcs.hp;
  var mpGain=Math.ceil(save.playerMp/2);
  save.playerMp+=mpGain; if(save.playerMp>pcs.mp) save.playerMp=pcs.mp;
  if(save.clearCount===9){
    /* clearCount==9 通关 → 第 10 关为第一 Boss 房间 */
    startFormalBossRoom(false,false);
  }else if(save.clearCount===16){
    /* clearCount==16 通关 → 第 17 关为第二 Boss（三弓神射手）房间 */
    startFormalBossRoom(true,false);
  }else if(save.clearCount===25){
    /* clearCount==25 通关 → 第 25 关为第三 Boss（大元素使者）房间 */
    startFormalBossRoom(false,true);
  }else{
    mapGenerate();
    save.playerX=save.start.x; save.playerY=save.start.y;
    generateMonsters();
  }
  bossExitOpen=false; bossMoveCounter=0;
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];  // 切场景：清空攻击特效，避免残留绘制
  if(!bossPreview) saveGame();
  redraw();
}
/* 最终关卡：5x15 全空地渐变过道，出生右中 (2,14)、出口左中 (2,0)，不写档并清档（与桌面版 StartFinalLevel 一致） */
function startFinalLevel(){
  save.mapGrid=[];
  for(var i=0;i<SIZE*SIZE;i++) save.mapGrid.push(0);
  save.start={x:14,y:2}; save.end={x:0,y:2};
  save.playerX=14; save.playerY=2;
  save.monsters=[]; save.pickups=[];
  bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0;
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];
  finalLevel=true;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  hasSave=false;
  screen='playing';
  toast('最终关卡：走到左侧出口，结束冒险！');
  redraw();
}
/* 最终关通关：第三次通关弹祝贺窗并清档回主菜单；第一/二次通关白屏过渡 → 周目选角（与桌面版 FinishFinalLevel 一致） */
function finishFinalLevel(){
  finalLevel=false;
  bossPreview=false; boss2Preview=false; boss3Preview=false;
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];
  if(save.runCount>=3){
    /* 第三次通关（第三周目走出最终关出口）：祝贺弹窗 → 清档回主菜单 */
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    hasSave=false;
    screen='menu';
    redraw();
    alert('恭喜通关！你已历经三次周目循环，冒险完成。');
    return;
  }
  /* 第一/二次通关：白屏过渡（约 0.7 秒，期间锁定全部输入）→ 进入周目选角页 */
  whiteFlash=true;
  screenAfterWhite='select';
  redraw();
  setTimeout(function(){
    whiteFlash=false;
    runSelect=true;
    screen='select';
    redraw();
  },WHITE_FLASH_MS);
}
function playerDie(){
  save.tempHP=0; save.archerBuff=0;
  save.playerMp=playerStats().mp;
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];  // 死亡返回主菜单：清空攻击特效，避免残留绘制
  if(!bossPreview) saveGame();
  bossPreview=false; boss2Preview=false; boss3Preview=false; bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0; finalLevel=false;
  screen='menu';
  redraw();
  alert('你被怪物击败了……');
}
function endBattle(victory){
  battle={active:false,moving:false,targeting:false,moveCount:0};
  if(victory){
    if(bossRoomActive){ onAllMonstersDead(); return; }
    toast('战斗胜利！');
  }
  redraw();
}
/* 怪物回合执行完毕后调用：双方互不在攻击范围 → 战斗自动结束回到探索（与桌面版 MaybeEndBattleAfterMonsterTurn 一致），
   避免残留战斗状态导致探索阶段 WASD 必须先点「移动」才能走 */
function maybeEndBattleAfterMonsterTurn(){
  if(!anyMonsterInPlayerRange()&&!anyMonsterCanAttackPlayer()) endBattle(false);
}
function enterBattle(monsterFirst){
  battle.active=true; battle.moving=false; battle.moveCount=0;
  if(monsterFirst){
    if(runMonsterTurn()){ playerDie(); return; }
    maybeEndBattleAfterMonsterTurn();
  }
  redraw();
}
function saveBackToMenu(){
  if(finalLevel){
    /* 最终关退出：不写档并清档（与桌面版 SaveAndBackToMenu 一致） */
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    hasSave=false;
  }else if(!bossPreview) saveGame();
  bossPreview=false; boss2Preview=false; boss3Preview=false; bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0; finalLevel=false;
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];  // 返回菜单：清空攻击特效，避免残留绘制
  screen='menu';
  redraw();
}

/* ============ 技能 ============ */
function doSkill(){
  if(battle.active){ battle.moving=false; battle.targeting=false; }
  var cls=save.characterId;
  if(save.run3Transformed){
    /* 三周目变身唯一技能「湮灭」：消耗 0 MP，对全场所有存活怪物造成 999 伤害（无视距离/隔墙/范围，直接击杀），
       与桌面版 RUN3_SKILLS 一致 */
    var n=0;
    for(var ai=0;ai<save.monsters.length;ai++){
      var am=save.monsters[ai];
      if(am.alive){
        am.hp-=999;
        am.alive=false;
        save.kills++;
        save.levelKills++;
        n++;
      }
    }
    toast(n>0?('湮灭！全场 '+n+' 只怪物化为虚无'):'湮灭！没有可攻击的怪物');
    if(n>0&&Math.floor(save.kills/10)>save.awarded){
      rewardFromSkill=true; rewardPopup=true;
      showReward();
      redraw();
      return;
    }
    if(!bossPreview) saveGame();
    var allDead3=true;
    for(var i3=0;i3<save.monsters.length;i3++) if(save.monsters[i3].alive){allDead3=false;break;}
    if(allDead3){ endBattle(true); return; }
    redraw();
    return;
  }
  if(cls===0){
    if(save.playerMp<2){ toast('MP 不足！'); redraw(); return; }
    save.playerMp-=2;
    var maxHp=playerStats().hp;
    save.playerHp+=10;
    if(save.playerHp>maxHp){
      var ov=save.playerHp-maxHp;
      save.playerHp=maxHp;
      save.tempHP+=ov; if(save.tempHP>99) save.tempHP=99;
    }
    toast(save.tempHP>0?('恢复 10 HP！ 临时HP:'+save.tempHP):'恢复 10 HP！');
  } else if(cls===1){
    if(save.playerMp<4){ toast('MP 不足！'); redraw(); return; }
    var aliveList=[];
    for(var i=0;i<save.monsters.length;i++) if(save.monsters[i].alive) aliveList.push(save.monsters[i]);
    if(aliveList.length===0){ toast('没有可攻击的怪物！'); redraw(); return; }
    save.playerMp-=4;
    shuffle(aliveList);
    var n=aliveList.length; if(n>3) n=3;
    var dmg=playerStats().atk+3;
    var hit=0;
    for(var j=0;j<n;j++){
      var t=aliveList[j];
      t.hp-=dmg; hit++;
      if(t.hp<=0){
        t.alive=false; save.kills++;
        /* 三周目变身：第三周目技能击杀第一只怪物触发（与桌面版 ReleaseSkill 一致） */
        if(save.runCount===3&&!save.run3Transformed&&!bossPreview){
          save.run3Transformed=true;
          save.playerHp=999; save.playerMp=999; save.tempHP=0;
          toast('三周目变身！你已觉醒为「湮灭」形态（全属性 999）');
        }
        if(!bossPreview) saveGame();
        if(Math.floor(save.kills/10)>save.awarded){
          rewardFromSkill=true; rewardPopup=true;
          showReward();
          redraw();
          return;
        }
      }
    }
    toast('群攻发动！对 '+hit+' 只怪物造成 '+dmg+' 伤害');
    var allDead2=true;
    for(var i2=0;i2<save.monsters.length;i2++) if(save.monsters[i2].alive){allDead2=false;break;}
    if(allDead2){ if(!bossPreview) saveGame(); endBattle(true); return; }
  } else {
    var cost=Math.ceil(save.playerMp*2/3); if(cost<1) cost=1;
    if(save.playerMp<cost){ toast('MP 不足！'); redraw(); return; }
    save.playerMp-=cost;
    save.archerBuff=cost;
    toast('强化！下次普攻伤害 +'+cost);
  }
  if(!bossPreview) saveGame();
  redraw();
}

/* ============ 战斗流程 ============ */
function doAttack(){
  var hasTarget=false;
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(m.alive&&playerInAttackRange(m)){hasTarget=true;break;} }
  if(!hasTarget){ toast('攻击范围内没有怪物！'); redraw(); return; }
  battle.targeting=true; battle.moving=false;
  redraw();
}
function doMove(){ battle.moving=true; redraw(); }
function finishAttackTurn(){
  var allDead=true;
  for(var i=0;i<save.monsters.length;i++) if(save.monsters[i].alive){allDead=false;break;}
  if(allDead){ endBattle(true); return; }
  if(runMonsterTurn()){ playerDie(); return; }
  maybeEndBattleAfterMonsterTurn();
  battle.moveCount=0; battle.moving=false; battle.targeting=false;
  if(!bossPreview) saveGame();
  redraw();
}
function attackMonster(target){
  var atk=playerStats().atk;
  atk+=save.archerBuff;
  save.archerBuff=0;
  /* 玩家攻击命中特效：按职业生成（战士月牙 / 弓箭手白色箭头 / 法师白色光球），与桌面版一致 */
  var ek=(save.characterId===2)?EFFECT_ARROW:(save.characterId===1)?EFFECT_ORB:EFFECT_SLASH;
  addEffect(ek,save.playerX,save.playerY,target.x,target.y);
  target.hp-=atk;
  /* Boss3 受击传送：命中后传送到玩家攻击范围外并休息一轮（与桌面版 TeleportBoss3 一致） */
  if(target.hp>0&&target.isBoss3&&target.type===BOSS3_TYPE){
    teleportBoss3(target);
    rollBoss3Elements(target);
    target.teleportSkip=true;
    toast('元素使者受到攻击后传送离开！');
  }
  if(target.hp<=0){
    target.alive=false;
    save.kills++;
    save.levelKills++;
    /* 三周目变身：第三周目击杀第一只怪物（普攻）触发，数值置 999、tempHP 清 0（与桌面版 AttackMonster 一致） */
    if(save.runCount===3&&!save.run3Transformed&&!bossPreview){
      save.run3Transformed=true;
      save.playerHp=999; save.playerMp=999; save.tempHP=0;
      toast('三周目变身！你已觉醒为「湮灭」形态（全属性 999）');
    }
    if(!bossPreview) saveGame();
    if(Math.floor(save.kills/10)>save.awarded){
      rewardFromSkill=false;
      rewardPopup=true;
      showReward();
      redraw();
      return;
    }
  }
  finishAttackTurn();
}
function chooseReward(choice){
  if(choice===0){ save.hpBonus++; save.playerHp++; }
  else if(choice===1){ save.atkBonus++; }
  else { save.mpBonus++; save.playerMp++; }
  save.awarded++;
  /* 白纸生成时机：加点奖励发放次数达到 1/2/3/4/5/8/15/18 时各生成 1 张（序号 1~8，与桌面版 ChooseReward 一致） */
  for(var pt=0;pt<PAPER_TRIGGER_AWARD.length;pt++){
    if(save.awarded===PAPER_TRIGGER_AWARD[pt]) spawnWhitePaper(pt+1);
  }
  rewardPopup=false;
  hideReward();
  if(!bossPreview) saveGame();
  if(rewardFromSkill){
    rewardFromSkill=false;
    battle.moveCount=0; battle.moving=false; battle.targeting=false;
    var allDeadR=true;
    for(var ir=0;ir<save.monsters.length;ir++) if(save.monsters[ir].alive){allDeadR=false;break;}
    if(allDeadR){ endBattle(true); return; }
    redraw();
    return;
  }
  finishAttackTurn();
}

/* ============ 移动 ============ */
function tryStep(nx,ny){
  /* 最终关：5x15 渐变过道，禁止走出 15 列 × 5 行边界（与桌面版一致） */
  if(finalLevel){
    if(nx<0||nx>=15||ny<0||ny>=5) return false;
  }else{
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) return false;
  }
  if(gridAt(nx,ny)===1) return false;
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(m.alive&&m.x===nx&&m.y===ny) return false; }
  return true;
}
function handleMove(dx,dy){
  var oldX=save.playerX, oldY=save.playerY;
  var nx=oldX+dx, ny=oldY+dy;
  if(!tryStep(nx,ny)) return;
  save.playerX=nx; save.playerY=ny;
  save.playerDir=dirFromDelta(dx,dy);
  tryPickupAt(nx,ny);
  if(nx===save.end.x&&ny===save.end.y){
    if(bossRoomActive&&!bossExitOpen){
      toast('通关出口尚未开放！');
    }else{
      completeLevel(); return;
    }
  }
  if(bossRoomActive&&bossMoveCounter<5){
    bossMoveCounter++;
    if(bossMoveCounter===5){ bossMoveCounter=0; spawnSinglePickupRandom(); }
  }
  if(newlyEnteredMonsterRange(oldX,oldY)){ enterBattle(true); return; }
  moveMonstersTowardPlayer();
  if(anyMonsterInPlayerRange()){ enterBattle(false); return; }
  if(!bossPreview) saveGame();
  redraw();
}
function handleBattleMove(dx,dy){
  var oldX=save.playerX, oldY=save.playerY;
  var nx=oldX+dx, ny=oldY+dy;
  if(!tryStep(nx,ny)) return;
  save.playerX=nx; save.playerY=ny;
  save.playerDir=dirFromDelta(dx,dy);
  battle.moveCount++;
  tryPickupAt(nx,ny);
  if(nx===save.end.x&&ny===save.end.y){
    if(bossRoomActive&&!bossExitOpen){
      toast('通关出口尚未开放！');
    }else{
      completeLevel(); return;
    }
  }
  if(bossRoomActive&&bossMoveCounter<5){
    bossMoveCounter++;
    if(bossMoveCounter===5){ bossMoveCounter=0; spawnSinglePickupRandom(); }
  }
  if(newlyEnteredMonsterRange(oldX,oldY)){
    if(runMonsterTurn()){ playerDie(); return; }
    maybeEndBattleAfterMonsterTurn();
    battle.moveCount=0; battle.moving=false;
    if(!bossPreview) saveGame(); redraw();
    return;
  }
  if(!anyMonsterInPlayerRange()&&!anyMonsterCanAttackPlayer()){
    endBattle(false);
    if(!bossPreview) saveGame();
    return;
  }
  if(battle.moveCount>=2){
    if(runMonsterTurn()){ playerDie(); return; }
    maybeEndBattleAfterMonsterTurn();
    battle.moveCount=0; battle.moving=false;
    if(!bossPreview) saveGame(); redraw();
    return;
  }
  battle.moving=false;
  if(!bossPreview) saveGame();
  redraw();
}

/* ============ 存档 ============ */
function saveGame(){
  var d={
    characterId:save.characterId, playerX:save.playerX, playerY:save.playerY,
    playerHp:save.playerHp, playerDir:save.playerDir,
    clearCount:save.clearCount, kills:save.kills, awarded:save.awarded,
    hpBonus:save.hpBonus, atkBonus:save.atkBonus, mpBonus:save.mpBonus,
    playerMp:save.playerMp, tempHP:save.tempHP, archerBuff:save.archerBuff,
    levelKills:save.levelKills||0,
    mapGrid:save.mapGrid, start:save.start, end:save.end, monsters:save.monsters,
    pickups:save.pickups||[],
    /* 桌面版新增字段：Boss 通关加成 / 多周目 / 三周目变身 / 白纸（与桌面版 SaveData 同义） */
    bossCleared:save.bossCleared||0,
    runCount:save.runCount||1,
    usedCharacterIds:save.usedCharacterIds||[],
    run3Transformed:!!save.run3Transformed,
    whitePaperGen:save.whitePaperGen||[0,0,0,0,0,0,0,0,0],
    whitePapersCollected:save.whitePapersCollected||[],
    groundPapers:save.groundPapers||[],
    bagGems:save.bagGems||0,
    bagHearts:save.bagHearts||0
  };
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(d)); hasSave=true; }catch(e){}
}
function newGame(){
  screen='select';
  redraw();
}
function chooseChar(cls){
  save={
    characterId:cls, playerX:0, playerY:0, playerHp:0, playerDir:DIR.UP,
    clearCount:0, kills:0, awarded:0, hpBonus:0, atkBonus:0, mpBonus:0,
    playerMp:0, tempHP:0, archerBuff:0, levelKills:0, mapGrid:[], start:{x:0,y:0}, end:{x:0,y:0}, monsters:[], pickups:[],
    /* 桌面版新增字段默认值：新游戏清 Boss 加成/周目/变身/白纸（与桌面版一致） */

  };

  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];  // 新游戏开始：清空攻击特效

  bossPreview=false; boss2Preview=false; boss3Preview=false; finalLevel=false;
  bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0;
  runSelect=false;   /* 新游戏：非周目选角（首周目，桌面版一致） */

}
/* 周目选角确认（第二/三周目）：保留全部加点数值与背包物品（含白纸已拾取/已生成标记），
   重置关卡进度（clearCount/bossCleared/levelKills/怪物），重新生成地图并从第 1 关开始下一周目；
   未拾取白纸（groundPapers）在新地图重新落位（周边一格优先）。与桌面版选角分支一致 */
function confirmRunSelect(cls){
  if(!save) return;
  var old=save;
  var usedIds=old.usedCharacterIds||[]; usedIds.push(cls);
  save={
    characterId:cls,
    playerX:0, playerY:0, playerHp:0, playerDir:DIR.UP,
    clearCount:0, kills:0, awarded:0, hpBonus:old.hpBonus, atkBonus:old.atkBonus, mpBonus:old.mpBonus,
    playerMp:0, tempHP:0, archerBuff:0, levelKills:0,
    mapGrid:[], start:{x:0,y:0}, end:{x:0,y:0}, monsters:[], pickups:[],
    /* 周目保留字段：白纸已生成标记/已拾取/地面未拾取跨周目保留；背包存量保留 */
    bossCleared:0, runCount:(old.runCount||1)+1, usedCharacterIds:usedIds,
    run3Transformed:old.run3Transformed||false,
    whitePaperGen:old.whitePaperGen||[0,0,0,0,0,0,0,0,0],
    whitePapersCollected:old.whitePapersCollected||[],
    groundPapers:old.groundPapers||[],
    bagGems:old.bagGems||0, bagHearts:old.bagHearts||0
  };
  var cs=playerStats();
  /* 保留加点：属性 = 基础 + 加成 */
  save.playerHp=cs.hp; save.playerMp=cs.mp;
  mapGenerate();
  save.playerX=save.start.x; save.playerY=save.start.y;
  generateMonsters();
  /* 清空普通微粒；未拾取白纸在新地图重新落位 */
  save.pickups=[];
  relayoutGroundPapers();
  battle={active:false,moving:false,targeting:false,moveCount:0};
  effects=[];
  rewardPopup=false;
  bossPreview=false; boss2Preview=false; boss3Preview=false; finalLevel=false;
  bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0;
  runSelect=false;   /* 本次周目选角完成，恢复普通流程 */
  screen='playing';
  saveGame();   /* 周目进度立即落盘 */
  hasSave=true;
  toast('第 '+(save.runCount)+' 周目开始！');
  redraw();
}
function loadGame(){
  var raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return false;
  try{
    var d=JSON.parse(raw);
    save={characterId:d.characterId, playerX:d.playerX, playerY:d.playerY, playerHp:d.playerHp,
      playerDir:d.playerDir, clearCount:d.clearCount, kills:d.kills, awarded:d.awarded,
      hpBonus:d.hpBonus, atkBonus:d.atkBonus, mpBonus:d.mpBonus, playerMp:d.playerMp,
      tempHP:d.tempHP, archerBuff:d.archerBuff, levelKills:d.levelKills||0, mapGrid:d.mapGrid,
      start:d.start, end:d.end, monsters:d.monsters||[], pickups:d.pickups||[],
      /* 桌面版新增字段：旧档缺失时取默认值（兼容旧存档，与桌面版 Load 默认一致） */
      bossCleared:d.bossCleared||0, runCount:d.runCount||1, usedCharacterIds:d.usedCharacterIds||[],
      run3Transformed:!!d.run3Transformed, whitePaperGen:d.whitePaperGen||[0,0,0,0,0,0,0,0,0],
      whitePapersCollected:d.whitePapersCollected||[], groundPapers:d.groundPapers||[],
      bagGems:d.bagGems||0, bagHearts:d.bagHearts||0};
  }catch(e){ return false; }
  if(!save.mapGrid||save.mapGrid.length!==SIZE*SIZE) return false;
  var pcs=playerStats();
  if(save.playerHp<=0||save.playerHp>pcs.hp) save.playerHp=pcs.hp;
  if(save.playerMp<=0||save.playerMp>pcs.mp) save.playerMp=pcs.mp;
  if(save.tempHP<0) save.tempHP=0;
  if(save.tempHP>99) save.tempHP=99;
  if(save.archerBuff<0) save.archerBuff=0;
  if(save.levelKills<0) save.levelKills=0;
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i];
    if(m.isBoss&&m.type===BOSS_TYPE){ m.hp=Math.min(25+save.bossCleared,m.hp); m.atk=7+save.bossCleared; m.maxhp=25+save.bossCleared; continue; }
    if(m.isBoss2&&m.type===BOSS2_TYPE){ m.hp=Math.min(25+save.bossCleared,m.hp); m.atk=10+save.bossCleared; m.maxhp=25+save.bossCleared; continue; }
    if(m.isBoss3&&m.type===BOSS3_TYPE){
      m.hp=Math.min(25+save.bossCleared,m.hp); m.atk=10+save.bossCleared; m.maxhp=25+save.bossCleared;
      if(!m.elementCells||!m.elementCells.length) rollBoss3Elements(m);
      if(typeof m.nearDir!=='number') m.nearDir=0;
      if(typeof m.teleportSkip!=='boolean') m.teleportSkip=false;
      continue;
    }
    var mcs=classStats(m.type);
    var growth=monsterGrowthTimes(save.clearCount);
    if(m.hp<=0||m.hp>mcs.hp+growth+save.bossCleared||m.atk<=0||m.atk>Math.ceil(mcs.atk/2)+growth+save.bossCleared){
      m.hp=mcs.hp; m.atk=Math.ceil(mcs.atk/2);
      applyMonsterGrowth(m,save.clearCount);
      /* Boss 通关加成：重建后全属性 +bossCleared（与桌面版 Load 一致） */
      m.hp+=save.bossCleared;
      m.atk+=save.bossCleared;
    }
    m.maxhp=m.hp;
  }
  if(save.monsters.length===0) generateMonsters();
  // Boss 房标志恢复：存档怪物含 Boss/Boss2/Boss3 视为处于 Boss 房间（桌面版语义，出口/步数计数重建）
  bossRoomActive=false; bossExitOpen=false; bossMoveCounter=0;
  for(var bi=0;bi<save.monsters.length;bi++){
    var bm=save.monsters[bi];
    if(bm.alive&&((bm.isBoss&&bm.type===BOSS_TYPE)||(bm.isBoss2&&bm.type===BOSS2_TYPE)||(bm.isBoss3&&bm.type===BOSS3_TYPE))){ bossRoomActive=true; break; }
  }
  battle={active:false,moving:false,targeting:false,moveCount:0};
  bossPreview=false; boss2Preview=false; boss3Preview=false; finalLevel=false;
  runSelect=false;   /* 继续游戏：非周目选角状态（桌面版一致） */
  screen='playing';
  redraw();
  return true;
}
function continueGame(){
  if(loadGame()){
    toast('存档已恢复');
  }else{
    alert('没有找到存档，请先开始新游戏。');
  }
}

/* ============ 绘制 ============ */
function drawSprite(sprite,px,py,scale,pal){
  for(var sy=0;sy<25;sy++){
    for(var sx=0;sx<25;sx++){
      var idx=sprite[sy][sx]; if(idx===0) continue;
      var c=pal[idx];
      ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
      ctx.fillRect(px+sx*scale,py+sy*scale,scale,scale);
    }
  }
}
function drawSpriteBorder(px,py,size,color){
  ctx.strokeStyle=color; ctx.lineWidth=2;
  ctx.strokeRect(px-2,py-2,size+4,size+4);
}
function drawRangeGridCell(gx,gy,fill,border){
  var px=gx*CELL, py=gy*CELL;
  // 半透明色底块：与桌面版 AlphaBlend 约 25% 不透明度一致（比原 0.35 更透）
  ctx.globalAlpha=0.25;
  ctx.fillStyle=fill;
  ctx.fillRect(px,py,CELL,CELL);
  ctx.globalAlpha=1;
  // 高亮实线边框（内缩 1px 避免裁边）
  ctx.strokeStyle=border; ctx.lineWidth=2;
  ctx.strokeRect(px+1,py+1,CELL-2,CELL-2);
}
function drawMap(){
  /* 最终关：5x15 全空地，按列暗红→浅绿渐变（与桌面版 DrawMap FinalLevel 一致，仅标出口） */
  if(finalLevel){
    for(var fy=0;fy<5;fy++){
      for(var fx=0;fx<15;fx++){
        var t=(fx/14);
        var r=Math.round(90+30*t), g=Math.round(25+175*t), b=Math.round(20+110*t);
        ctx.fillStyle='rgb('+r+','+g+','+b+')';
        ctx.fillRect(fx*CELL,fy*CELL,CELL,CELL);
      }
    }
    ctx.font='bold 14px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgb(200,30,30)'; ctx.fillText('出口',save.end.x*CELL+CELL/2,save.end.y*CELL+CELL/2);
    return;
  }
  // 黑红砖墙/路径材质（与桌面版 DrawMap 一致：砖缝黑底+暗红砖3层错缝 / 深黑灰底+暗红点缀）
  ctx.fillStyle='rgb(18,14,20)'; ctx.fillRect(0,0,MAP_PX,MAP_PX);
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      var px=x*CELL, py=y*CELL;
      if(gridAt(x,y)===1){
        ctx.fillStyle='rgb(8,6,8)'; ctx.fillRect(px,py,CELL,CELL);            // 砖缝黑底
        ctx.fillStyle='rgb(122,28,26)';                                        // 暗红砖块
        // 层 1/3（两块砖，中间留 2px 缝）；层 2（三块砖，半砖错缝）——与桌面版 DrawMap 完全一致
        ctx.fillRect(px+1,py+1,18,13);
        ctx.fillRect(px+21,py+1,19,13);
        ctx.fillRect(px+1,py+14,8,13);
        ctx.fillRect(px+11,py+14,19,13);
        ctx.fillRect(px+32,py+14,8,13);
        ctx.fillRect(px+1,py+27,18,14);
        ctx.fillRect(px+21,py+27,19,14);
      }else{
        ctx.fillStyle='rgb(24,18,22)'; ctx.fillRect(px,py,CELL,CELL);          // 深黑灰底
        ctx.fillStyle='rgb(98,28,26)';                                          // 暗红点缀
        if((x+y)%2===0){
          ctx.fillRect(px+6,py+6,3,3);                                         // 左上一小点
          ctx.fillRect(px+32,py+32,3,3);                                       // 右下一小点
        }else{
          ctx.fillRect(px+17,py+19,7,2);                                       // 中央一短横线
        }
      }
    }
  }
  ctx.strokeStyle='rgb(74,36,38)'; ctx.lineWidth=1; ctx.beginPath();
  for(var i=0;i<=SIZE;i++){
    ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,MAP_PX);
    ctx.moveTo(0,i*CELL); ctx.lineTo(MAP_PX,i*CELL);
  }
  ctx.stroke();
  ctx.font='bold 14px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgb(20,140,60)'; ctx.fillText('S',save.start.x*CELL+CELL/2,save.start.y*CELL+CELL/2);
  if(bossExitOpen){
    // Boss 房间通关出口：Boss 被击败后在终点格绘制醒目绿色发光出口（与桌面版一致）
    var ex=save.end.x*CELL, ey=save.end.y*CELL;
    ctx.fillStyle='rgba(0,220,90,0.45)'; ctx.fillRect(ex,ey,CELL,CELL);
    ctx.strokeStyle='rgb(0,255,130)'; ctx.lineWidth=2; ctx.strokeRect(ex+1,ey+1,CELL-2,CELL-2);
    ctx.fillStyle='rgb(0,255,130)';
    ctx.fillText('出口',ex+CELL/2,ey+CELL/2);
  }else{
    ctx.fillStyle='rgb(200,30,30)'; ctx.fillText('E',save.end.x*CELL+CELL/2,save.end.y*CELL+CELL/2);
  }
}
function drawPlayer(){
  var sprite=SPRITES[save.characterId];
  /* 三周目变身角色变黄；红窗口期仍优先变红（与桌面版一致） */
  var pal=(Date.now()<playerHitUntil)?PALETTE_RED:(save.run3Transformed?PALETTE_YELLOW:PALETTE);
  drawSprite(sprite,save.playerX*CELL,save.playerY*CELL,1,pal);
  if(battle.active) drawSpriteBorder(save.playerX*CELL,save.playerY*CELL,25,'rgb(255,220,60)');
}
function drawMonsters(){
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i]; if(!m.alive) continue;
    if(m.isBoss&&m.type===BOSS_TYPE){
      // 第一 Boss：暗红盔甲战士造型（与桌面版 BOSS+PALETTE_BOSS 一致）
      drawSprite(BOSS,m.x*CELL,m.y*CELL,1,PALETTE_BOSS);
      drawBossInfo(m);
    }else if(m.isBoss2&&m.type===BOSS2_TYPE){
      // Boss2 三弓神射手：专属造型 + 调色板
      drawSprite(BOSS2,m.x*CELL,m.y*CELL,1,PALETTE_BOSS2);
      drawBossInfo(m);
    }else if(m.isBoss3&&m.type===BOSS3_TYPE){
      // Boss3 大元素使者：专属造型 + 调色板
      drawSprite(BOSS3,m.x*CELL,m.y*CELL,1,PALETTE_BOSS3);
      drawBossInfo(m);
    }else{
      drawSprite(SPRITES[m.type],m.x*CELL,m.y*CELL,1,PALETTE_RED);
    }
    if(battle.active) drawSpriteBorder(m.x*CELL,m.y*CELL,25,'rgb(255,220,60)');
  }
}
/* Boss 头顶信息：HP:x/25 攻:x（Boss2 追加当前弓名；Boss3 显示元素使者），顶部留白不足时下移（与桌面版一致） */
function drawBossInfo(m){
  var maxhp=(m.maxhp)?m.maxhp:25;
  var s;
  if(m.isBoss3&&m.type===BOSS3_TYPE) s='元素使者 HP:'+m.hp+'/'+maxhp+' 攻:'+m.atk;
  else if(m.isBoss2&&m.type===BOSS2_TYPE){
    s='Boss2 HP:'+m.hp+'/'+maxhp+' 攻:'+m.atk;
    var bn=(m.bowState===0)?'黄弓':(m.bowState===1)?'蓝弓':'红弓'; s+=' '+bn;
  }
  else s='Boss HP:'+m.hp+'/'+maxhp+' 攻:'+m.atk;
  var tx=m.x*CELL, ty=m.y*CELL;
  var textY=ty-18;
  if(textY<10) textY=10;
  ctx.font='bold 12px Courier New'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgb(0,0,0)';
  ctx.fillText(s,tx+CELL/2+1,textY+1);
  ctx.fillStyle='rgb(255,255,255)';
  ctx.fillText(s,tx+CELL/2,textY);
}
/* 微粒：蓝菱 +1MP / 红心 +2HP / 白纸 kind=5（与桌面版 BLUE_GEM/RED_HEART/WHITE_PAPER 一致） */
function drawPickups(){
  for(var i=0;i<save.pickups.length;i++){
    var p=save.pickups[i];
    if(p.kind===5){
      /* 白纸：纯白纸面+浅灰横线+折角像素造型，格内下方标注序号 1~9（与桌面版一致） */
      drawSprite(WHITE_PAPER,p.x*CELL,p.y*CELL,1,PICKUP_WHITE);
      ctx.font='bold 9px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgb(80,80,90)';
      ctx.fillText(String(p.index),p.x*CELL+CELL/2,p.y*CELL+CELL-7);
      continue;
    }
    var spr=(p.kind===1)?RED_HEART:BLUE_GEM;
    var pal=(p.kind===1)?PICKUP_RED:PICKUP_BLUE;
    drawSprite(spr,p.x*CELL,p.y*CELL,1,pal);
  }
}
/* 怪物下一步位置虚影：预测每只存活怪物的下一步移动格（预测逻辑与 moveMonstersTowardPlayer 一致：
   BFS 最短路 + 可走方向候选，虚影取最短路方向），在该格绘制高透明造型副本（每像素 alpha 0.16，
   比攻击范围 0.25 更透，形成显著虚影）；玩家在攻击范围且无墙（含 Boss 特例）时本回合攻击不移动
   → 不显示虚影；四方向被包围原地不动 → 不显示虚影。绘制在地图/拾取物之上、怪物本体之下
   （与桌面版 DrawMonsterGhosts 一致） */
function drawMonsterGhosts(){
  var INF=1<<29;
  var dist=[]; for(var yy=0;yy<SIZE;yy++){ dist.push([]); for(var xx=0;xx<SIZE;xx++) dist[yy].push(INF); }
  var q=[], qh=0;
  dist[save.playerY][save.playerX]=0; q.push([save.playerX,save.playerY]);
  while(qh<q.length){
    var cur=q[qh++], cx=cur[0], cy=cur[1];
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var di=0;di<4;di++){
      var nx=cx+dirs[di][0], ny=cy+dirs[di][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(gridAt(nx,ny)===1) continue;
      if(dist[ny][nx]!==INF) continue;
      dist[ny][nx]=dist[cy][cx]+1; q.push([nx,ny]);
    }
  }
  var dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i]; if(!m.alive) continue;
    /* 攻击判定（与 runMonsterTurn 一致）：玩家在范围且无墙 → 攻击不移动 → 不显示虚影 */
    var willAttack=false;
    if(m.isBoss2&&m.type===BOSS2_TYPE){
      willAttack=boss2InFullRange(m,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY);
    }else if(m.isBoss&&m.type===BOSS_TYPE){
      willAttack=inAttackRange(m.type,m.x,m.y,m.dir,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY);
    }else if(m.isBoss3&&m.type===BOSS3_TYPE){
      if(m.teleportSkip) continue;   /* 受击传送后休息一轮（不移动不攻击），不显示虚影 */
      willAttack=boss3HitsAt(m,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY);
    }else{
      willAttack=inAttackRange(m.type,m.x,m.y,m.dir,save.playerX,save.playerY)&&hasClearPath(m.x,m.y,save.playerX,save.playerY);
    }
    if(willAttack) continue;
    var bestCands=[], bestDist=INF;
    for(var d=0;d<4;d++){
      var nx=m.x+dirs4[d][0], ny=m.y+dirs4[d][1];
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE) continue;
      if(gridAt(nx,ny)===1) continue;
      if(nx===save.playerX&&ny===save.playerY) continue;
      var occ=false;
      for(var j=0;j<save.monsters.length;j++){
        var o=save.monsters[j];
        if(!o.alive||o===m) continue;
        if(o.x===nx&&o.y===ny){ occ=true; break; }
      }
      if(occ) continue;
      if(dist[ny][nx]<bestDist){ bestDist=dist[ny][nx]; bestCands.length=0; }
      if(dist[ny][nx]===bestDist&&bestDist<INF) bestCands.push([dirs4[d][0],dirs4[d][1]]);
    }
    if(bestCands.length===0) continue;   /* 四方向都不可动 → 原地不动，不显示虚影 */
    var gx=m.x+bestCands[0][0], gy=m.y+bestCands[0][1];
    var sprite, pal;
    if(m.isBoss&&m.type===BOSS_TYPE){ sprite=BOSS; pal=PALETTE_BOSS; }
    else if(m.isBoss2&&m.type===BOSS2_TYPE){ sprite=BOSS2; pal=PALETTE_BOSS2; }
    else if(m.isBoss3&&m.type===BOSS3_TYPE){ sprite=BOSS3; pal=PALETTE_BOSS3; }
    else { sprite=SPRITES[m.type]; pal=PALETTE_RED; }
    /* 高透明造型副本：每像素 rgba alpha 0.16（比攻击范围 0.25 更透，形成显著虚影） */
    for(var sy=0;sy<25;sy++){
      for(var sx=0;sx<25;sx++){
        var idx=sprite[sy][sx]; if(idx===0) continue;
        var c=pal[idx];
        ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',0.16)';
        ctx.fillRect(gx*CELL+sx,gy*CELL+sy,1,1);
      }
    }
  }
}
function drawAttackRanges(){
  // 玩家攻击范围：淡青底 rgba≈0.35 + 高亮框（桌面值 RGB(0,150,120)/RGB(85,190,165)）
  for(var y=0;y<SIZE;y++){
    for(var x=0;x<SIZE;x++){
      if(inAttackRange(save.characterId,save.playerX,save.playerY,save.playerDir,x,y))
        drawRangeGridCell(x,y,'rgb(0,150,120)','rgb(85,190,165)');
    }
  }
  // 所有存活怪物攻击范围：淡橙底 + 橙黄框（探索与战斗阶段均显示；仅显示无墙可命中格）
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i]; if(!m.alive) continue;
    if(m.isBoss2&&m.type===BOSS2_TYPE){
      // Boss2：按当前弓绘制实际范围；失去的 2 格以灰暗底 + 叉号标出（与判定共用 missA/missB）
      for(var idx=0;idx<boss2RangeCount(m.bowState);idx++){
        var c=boss2CellForIdx(m,idx);
        if(!c) continue;
        if(c.x<0||c.x>=SIZE||c.y<0||c.y>=SIZE) continue;
        if(boss2MissedAt(m,c.x,c.y)){
          drawRangeGridCell(c.x,c.y,'rgb(70,66,74)','rgb(150,140,155)');
          ctx.font='bold 20px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillStyle='rgb(200,190,210)';
          ctx.fillText('×',c.x*CELL+CELL/2,c.y*CELL+CELL/2);
        }else{
          drawRangeGridCell(c.x,c.y,'rgb(170,95,20)','rgb(195,175,65)');
        }
      }
      continue;
    }
    if(m.isBoss3&&m.type===BOSS3_TYPE){
      // Boss3：元素范围 + 身边一格（无墙可命中格，与判定共用 boss3HitsAt）
      for(var y3=0;y3<SIZE;y3++){
        for(var x3=0;x3<SIZE;x3++){
          if(boss3HitsAt(m,x3,y3)&&hasClearPath(m.x,m.y,x3,y3))
            drawRangeGridCell(x3,y3,'rgb(170,95,20)','rgb(195,175,65)');
        }
      }
      continue;
    }
    for(var y2=0;y2<SIZE;y2++){
      for(var x2=0;x2<SIZE;x2++){
        if(!inAttackRange(m.type,m.x,m.y,m.dir,x2,y2)) continue;
        if(m.isBoss&&m.type===BOSS_TYPE&&bossMissedAt(m,x2,y2)) continue; // 缺格不显示
        if(!hasClearPath(m.x,m.y,x2,y2)) continue;                          // 隔墙不显示（与判定一致）
        drawRangeGridCell(x2,y2,'rgb(170,95,20)','rgb(195,175,65)');
      }
    }
  }
}
/* 攻击特效：生成特效（命中时调用，先结算伤害、特效仅视觉叠加保留约 400ms，到期自动清除）
   kind：0=月牙(Slash) / 1=白色箭头(Arrow) / 2=白色光球(Orb)；from 为攻击方格、to 为受击方格 */
function addEffect(kind,fx,fy,tx,ty){
  effects.push({active:true,kind:kind,px:fx,py:fy,x:tx,y:ty,until:Date.now()+EFFECT_MS});
  setTimeout(function(){
    clearExpiredEffects();
    if(screen==='playing') redraw();
  },EFFECT_MS);
}
function clearExpiredEffects(){
  var now=Date.now();
  for(var i=effects.length-1;i>=0;i--) if(effects[i].until<=now) effects.splice(i,1);
}
function drawEffects(){
  var now=Date.now();
  for(var i=0;i<effects.length;i++){
    var e=effects[i];
    if(!e.active||now>=e.until) continue;
    var cx=e.x*CELL+CELL/2, cy=e.y*CELL+CELL/2;
    if(e.kind===EFFECT_SLASH){
      /* 战士月牙刀刃：9x7 点阵模板（每点 2x2 白色像素），以受击格中心为基准居中 */
      var rows=['..##.....','.###.....','.####....','.#####...','.####....','.###.....','..##.....'];
      for(var r=0;r<7;r++) for(var c=0;c<9;c++) if(rows[r].charAt(c)==='#'){
        ctx.fillStyle='rgb(255,255,255)'; ctx.fillRect(cx-9+c*2,cy-7+r*2,2,2);
      }
    }else if(e.kind===EFFECT_ARROW){
      /* 弓箭手白色箭头：攻击方格中心 -> 受击方格中心的 2px 白直线，受击端叠加 V 形箭头头 */
      var sx=e.px*CELL+CELL/2, sy=e.py*CELL+CELL/2;
      ctx.strokeStyle='rgb(255,255,255)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(cx,cy); ctx.stroke();
      var dx=cx-sx, dy=cy-sy, len=Math.sqrt(dx*dx+dy*dy);
      if(len>0.001){
        var ux=dx/len, uy=dy/len;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-ux*10-uy*6,cy-uy*10+ux*6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-ux*10+uy*6,cy-uy*10-ux*6); ctx.stroke();
      }
    }else if(e.kind===EFFECT_ORB){
      /* 法师白色光球：受击格中心两阶白色像素圆（外圈淡白 r=4 + 内芯纯白 r=2），每点 2x2 */
      var outer=['....#....','...###...','..#####..','.#######.','#########','.#######.','..#####..','...###...','....#....'];
      for(var r=0;r<9;r++) for(var c=0;c<9;c++) if(outer[r].charAt(c)==='#'){
        ctx.fillStyle='rgb(215,225,245)'; ctx.fillRect(cx-9+c*2,cy-9+r*2,2,2);
      }
      var core=['.###.','#####','#####','#####','.###.'];
      for(var r=0;r<5;r++) for(var c=0;c<5;c++) if(core[r].charAt(c)==='#'){
        ctx.fillStyle='rgb(255,255,255)'; ctx.fillRect(cx-5+c*2,cy-5+r*2,2,2);
      }
    }
  }
}

function updateSelectCards(){
  var cards=document.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    var cv=cards[i].querySelector('canvas');
    var c2=cv.getContext('2d');
    var spr=SPRITES[i];
    /* 周目选角：历史已用角色灰卡（PALETTE_GRAY），未用角色保持原色（与桌面版一致） */
    var used=false;
    if(runSelect&&save){
      var ids=save.usedCharacterIds||[];
      for(var ui=0;ui<ids.length;ui++){ if(ids[ui]===i){ used=true; break; } }
    }
    var pal=(used)?PALETTE_GRAY:PALETTE;
    cards[i].className='card'+(used?' used':'');
    var scale=8; // 200px
    c2.fillStyle='rgb(20,24,32)'; c2.fillRect(0,0,200,200);
    var ox=(200-25*scale)/2, oy=(200-25*scale)/2;
    for(var sy=0;sy<25;sy++){
      for(var sx=0;sx<25;sx++){
        var idx=spr[sy][sx]; if(idx===0) continue;
        var col=pal[idx];
        c2.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
        c2.fillRect(ox+sx*scale,oy+sy*scale,scale,scale);
      }
    }

}

function redraw(){

  for(var i=0;i<screens.length;i++) screens[i].classList.remove('active');
  if(screen==='menu'){ document.getElementById('screen-menu').classList.add('active'); }
  else if(screen==='select'){
    document.getElementById('screen-select').classList.add('active');

/* 怪物血条区：状态栏下方最多 5 行，普通怪红条、Boss 橙红条，名称+血条+HP 数值，死亡移除（与桌面版一致） */
function updateMonsterBars(){
  var box=document.getElementById('monster-bars');
  if(!box) return;
  if(!save){ box.style.display='none'; return; }
  var rows=[];
  for(var i=0;i<save.monsters.length;i++){
    var m=save.monsters[i];
    if(!m.alive) continue;
    var isB=(m.isBoss||m.isBoss2||m.isBoss3);
    var name;
    if(m.isBoss3&&m.type===BOSS3_TYPE) name='元素使者';
    else if(m.isBoss2&&m.type===BOSS2_TYPE) name='Boss2('+((m.bowState===0)?'黄弓':(m.bowState===1)?'蓝弓':'红弓')+')';
    else if(m.isBoss&&m.type===BOSS_TYPE) name='Boss';
    else name=MONSTER_NAMES[m.type];
    var maxhp=(m.maxhp)?m.maxhp:25;
    var pct=Math.max(0,Math.min(100,Math.round(m.hp/maxhp*100)));
    var row='<div class="mb-row"><span class="mb-name'+(isB?' boss':'')+'">'+name+'</span>'
      +'<span class="mb-bar-bg"><span class="mb-bar-fill'+(isB?' boss':'')+'" style="width:'+pct+'%"></span></span>'
      +'<span class="mb-hp">'+m.hp+'/'+maxhp+'</span></div>';
    rows.push(row);
    if(rows.length>=5) break;
  }
  if(rows.length===0){ box.style.display='none'; }
  else{ box.style.display='block'; box.innerHTML=rows.join(''); }
}

    h2+='<div class="bag-row"><div class="bag-desc"><b>蓝色微粒（蓝菱）</b>：存量 '+((save.bagGems||0))+' / 10</div>'
      +'<div class="bag-act"><button onclick="useBagGem()">使用</button></div></div>';

      +'<div class="bag-act"><button onclick="openBagWhitePaper()">白纸</button></div></div>';
    body.innerHTML=h2;
    btns.innerHTML='<button onclick="closeBag()">关闭背包</button>';

function useBagHeart(){
  if(!save) return;
  if((save.bagHearts||0)<=0){ toast('没有红色微粒！'); return; }
  var pcs=playerStats();
  if(save.playerHp>=pcs.hp){ toast('HP 已满！'); return; }
  save.bagHearts--;
  save.playerHp+=2; if(save.playerHp>pcs.hp) save.playerHp=pcs.hp;
  toast('使用红色微粒：HP+2');
  saveGame();
  updateTop();
  renderBag();
  redraw();
}
function useBagGem(){
  if(!save) return;
  if((save.bagGems||0)<=0){ toast('没有蓝色微粒！'); return; }
  var pcs=playerStats();
  if(save.playerMp>=pcs.mp){ toast('MP 已满！'); return; }
  save.bagGems--;
  save.playerMp+=1; if(save.playerMp>pcs.mp) save.playerMp=pcs.mp;
  toast('使用蓝色微粒：MP+1');
  saveGame();
  updateTop();
  renderBag();
  redraw();
}

        for(var ui=0;ui<ids.length;ui++){ if(ids[ui]===cls){ used=true; break; } }
        if(used){
          toast('该角色已在之前周目使用过！');
          return;
        }
        confirmRunSelect(cls);
        return;
      }
      chooseChar(cls);
    });
  })(ci);
}
var dbtns=document.querySelectorAll('.dbtn');
for(var bi=0;bi<dbtns.length;bi++){
  (function(btn){
    btn.addEventListener('click',function(){
      if(rewardPopup||whiteFlash||screen!=='playing') return;
      var dx=parseInt(btn.getAttribute('data-dx'),10);
      var dy=parseInt(btn.getAttribute('data-dy'),10);
      if(battle.active&&battle.moving) handleBattleMove(dx,dy);
      else if(!battle.active) handleMove(dx,dy);
    });
  })(dbtns[bi]);
}

game.addEventListener('click',function(e){
  if(rewardPopup||whiteFlash||screen!=='playing') return;
  if(!battle.active||!battle.targeting) return;
  var r=game.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*MAP_PX;
  var y=(e.clientY-r.top)/r.height*MAP_PX;
  var gx=Math.floor(x/CELL), gy=Math.floor(y/CELL);
  var target=null;
  for(var i=0;i<save.monsters.length;i++){ var m=save.monsters[i]; if(m.alive&&m.x===gx&&m.y===gy){target=m;break;} }
  if(target&&playerInAttackRange(target)){
    attackMonster(target);
  }else if(target){
    toast('该怪物不在攻击范围内！');
    battle.targeting=false;
    redraw();
  }else{
    toast('请选择攻击范围内的怪物！');
    battle.targeting=false;
    redraw();
  }
});

window.addEventListener('keydown',function(e){
  if(rewardPopup) return;
  if(whiteFlash) return;   /* 周目白屏过渡：锁定全部输入（桌面版 g_whiteFlash） */
  var k=e.key;
  if(screen==='playing'&&bagOpen){
    /* 背包打开：E/Esc 关闭或返回，忽略其它游戏按键 */
    if(k==='Escape'){ if(bagWhitePaperView){ bagWhitePaperView=false; renderBag(); } else { closeBag(); } }
    else if(k==='e'||k==='E'){ closeBag(); }
    return;
  }
  var up=(k==='w'||k==='W'||k==='ArrowUp');
  var down=(k==='s'||k==='S'||k==='ArrowDown');
  var left=(k==='a'||k==='A'||k==='ArrowLeft');
  var right=(k==='d'||k==='D'||k==='ArrowRight');
  var q=(k==='q'||k==='Q');
  if(screen!=='playing') return;
  if(k==='e'||k==='E'){ toggleBag(); return; }
  if(k==='b'||k==='B'){ toggleBag(); return; }
  if(k==='Escape'){ saveBackToMenu(); return; }
  if(q){ doSkill(); return; }
  if(battle.active&&battle.moving){
    if(up) handleBattleMove(0,-1);
    else if(down) handleBattleMove(0,1);
    else if(left) handleBattleMove(-1,0);
    else if(right) handleBattleMove(1,0);
    return;
  }
  if(!battle.active){
    if(up) handleMove(0,-1);
    else if(down) handleMove(0,1);
    else if(left) handleMove(-1,0);
    else if(right) handleMove(1,0);
  }
});

/* ============ 初始化 ============ */
updateSelectCards();
redraw();
</script>
</body>
</html>
